[project]
name = "chessllm"
version = "0.1.0"
description = "Teaching a small LLM to pick chess moves with RLVR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "matplotlib>=3.11.1",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "runpod>=1.11.0",
    # transformers' actual floor. Deliberately loose: the RunPod image ships
    # its own torch and the pod venv reuses it instead of downloading a second
    # CUDA wheel, so this must not demand a newer one.
    "torch>=2.4",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
]

# Point the type checkers at this project's venv rather than the repo-root
# one, which the chapter_* notebooks use and which has no chess installed.
[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
